<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" role="img" aria-label="NepoOwen: self-taught programmer from Sweden">
  <style>
    .name { font: 700 46px "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #8f8fff; }
    .mono { font: 20px Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace; }
    .prompt { fill: #8f8fff; }
    .typed { fill: #d7d7e0; }
    .line { animation: show 12s step-end infinite; }
    .mover { animation: 12s infinite; }
    .l1 .mover, .l3 .mover { animation-name: type34; }
    .l2 .mover { animation-name: type31; }
    .l2, .l2 .mover { animation-delay: -8s; }
    .l3, .l3 .mover { animation-delay: -4s; }
    @keyframes show { 0% { opacity: 1; } 33.3% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes type34 {
      0% { transform: translateX(0); animation-timing-function: steps(34); }
      12% { transform: translateX(408px); }
      27% { transform: translateX(408px); animation-timing-function: steps(34); }
      32% { transform: translateX(0); }
      100% { transform: translateX(0); }
    }
    @keyframes type31 {
      0% { transform: translateX(0); animation-timing-function: steps(31); }
      12% { transform: translateX(372px); }
      27% { transform: translateX(372px); animation-timing-function: steps(31); }
      32% { transform: translateX(0); }
      100% { transform: translateX(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .line, .mover { animation: none; }
      .l2, .l3, .mover { display: none; }
    }
  </style>

  <clipPath id="card">
    <rect x="1" y="1" width="798" height="218" rx="14"/>
  </clipPath>

  <rect x="1" y="1" width="798" height="218" rx="14" fill="#14141a"/>

  <circle cx="34" cy="32" r="6" fill="#ff5f57"/>
  <circle cx="54" cy="32" r="6" fill="#febc2e"/>
  <circle cx="74" cy="32" r="6" fill="#28c840"/>

  <text class="name" x="46" y="118">NepoOwen</text>

  <text class="mono prompt" x="48" y="166">&gt;</text>

  <g clip-path="url(#card)">
    <g class="line l1">
      <text class="mono typed" x="72" y="166" textLength="408" lengthAdjust="spacing">self-taught programmer from Sweden</text>
      <g class="mover">
        <rect x="72" y="144" width="430" height="32" fill="#14141a"/>
        <rect x="72" y="147" width="10" height="24" fill="#8f8fff"/>
      </g>
    </g>
    <g class="line l2">
      <text class="mono typed" x="72" y="166" textLength="372" lengthAdjust="spacing">C++, TypeScript, Python, C, Lua</text>
      <g class="mover">
        <rect x="72" y="144" width="430" height="32" fill="#14141a"/>
        <rect x="72" y="147" width="10" height="24" fill="#8f8fff"/>
      </g>
    </g>
    <g class="line l3">
      <text class="mono typed" x="72" y="166" textLength="408" lengthAdjust="spacing">reverse engineering &amp; game modding</text>
      <g class="mover">
        <rect x="72" y="144" width="430" height="32" fill="#14141a"/>
        <rect x="72" y="147" width="10" height="24" fill="#8f8fff"/>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="798" height="218" rx="14" fill="none" stroke="#2c2c3a" stroke-width="2"/>
</svg>
